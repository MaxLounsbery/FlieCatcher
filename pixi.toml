[workspace]
authors = ["Max Lounsbery <maximuslouns@gmail.com>"]
channels = ["robostack-humble", "conda-forge"]
name = "lab3"
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]
start = "ros2 run pub fly_catcher"
build = "colcon build --symlink-install"

[activation]
scripts = ["install/setup.sh"]

[dependencies]
ros-humble-ros-base = "*"
colcon-common-extensions = ">=0.3.0,<0.4"
python = "3.12.*"
ros-humble-irobot-create-msgs = ">=2.1.0,<3"
libcamera = ">=0.5.1,<0.6"
numpy = ">=2.5.4,<3"
c-compiler = ">=2.0.0,<3"
pykms = ">=0.dev.2025.8.7,<0.1dev"

[pypi-dependencies]
picamera2 = ">=0.3.39, <0.4"
opencv-python-headless = ">=5.1.0.95, <6"

[activation.env]
LIBCAMERA_IPA_PROXY_PATH = "$CONDA_PREFIX/libexec/libcamera"
LIBCAMERA_IPA_MODULE_PATH = "$CONDA_PREFIX/lib/libcamera/ipa"
LIBCAMERA_IPA_CONFIG_PATH = "/usr/share/libcamera/ipa"
